name: 'Orquestador de Compilación con Firma'

on:
  workflow_dispatch:

jobs:
  preparar-fuente:
    runs-on: ubuntu-22.04
    steps:
      - name: Clonar el WhatsApp Lite Original
        run: git clone https://github.com/Bittu-the-coder/whatsapp-lite fuente-app

      - name: Modificar código fuente (Ejemplo)
        run: |
          cd fuente-app
          # Eliminamos el historial de Git original para que tu repositorio trate los archivos como reales y no como un submódulo vacío
          rm -rf .git
          sed -i 's/"name": "whatsapp-lite"/"name": "whatsapp-lite-custom"/g' package.json
      
      - name: Compartir código preparado
        uses: actions/upload-artifact@v4
        with:
          name: fuente-app
          path: fuente-app/
          if-no-files-found: error
          retention-days: 1

  compilar-aplicacion:
    needs: preparar-fuente
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Linux Intel estable
          - os: ubuntu-22.04
            architecture: amd64
          
          # 2. Linux ARM64 nativo
          - os: ubuntu-22.04-arm
            architecture: arm64
          
          # 3. macOS Intel (Configurado para compilar ambas arquitecturas de Apple)
          - os: macos-13
            architecture: multi-arch
            target: 'universal-apple-darwin'

    runs-on: ${{ matrix.os }}
    steps:
      - name: Descargar código preparado
        uses: actions/download-artifact@v4
        with:
          name: fuente-app
          path: fuente-app

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Instalar Rust (Entorno Linux)
        if: startsWith(matrix.os, 'ubuntu')
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Rust (Entorno macOS Multi-arquitectura)
        if: matrix.os == 'macos-13'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Instalar librerías de desarrollo (Solo Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils

      - name: Instalar dependencias del proyecto
        run: npm install
        working-directory: ./fuente-app

      - name: Compilar con Tauri (Para Linux)
        if: startsWith(matrix.os, 'ubuntu')
        working-directory: ./fuente-app
        run: npm run tauri build

      - name: Compilar con Tauri (Para macOS)
        if: matrix.os == 'macos-13'
        working-directory: ./fuente-app
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: npm run tauri build -- --target x86_64-apple-darwin --target aarch64-apple-darwin

      - name: Guardar instaladores como Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-lite-${{ matrix.os }}-${{ matrix.architecture }}
          path: |
            fuente-app/src-tauri/target/release/bundle/deb/*.deb
            fuente-app/src-tauri/target/release/bundle/appimage/*.AppImage
            fuente-app/src-tauri/target/release/bundle/dmg/*.dmg
            fuente-app/src-tauri/target/release/bundle/macos/*.app
